# Build TF-M (BL2 + secure image) alongside this app, sign both images and merge them into tfm_merged.hex
CONFIG_BUILD_WITH_TFM=y

# Use TF-M's base configuration, not one of its small/medium/large presets
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y

# Version written into this app's image header at signing time; BL2 uses it for rollback protection
CONFIG_TFM_IMAGE_VERSION_NS="0.0.1+0"
